# All services share one container, so loopback connections are NOT trusted
# (the official compose trusts 127.0.0.1 because each service has its own IP).
# The unix socket lives in /tmp/supabase/pg, a tmpfs only this container sees.
local all  all                trust
host  all  all  127.0.0.1/32  scram-sha-256
host  all  all  ::1/128       scram-sha-256
host  all  all  0.0.0.0/0     scram-sha-256
host  all  all  ::0/0         scram-sha-256
